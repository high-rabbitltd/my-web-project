<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HeartWave - 당신을 위한 메시지</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- 편지 도착 알림 뷰 (초기 화면) -->
    <div id="intro-view" class="view-container active">
        <div class="envelope-container">
            <div class="sparkles">✨</div>
            <i class="fa-solid fa-envelope-open-text envelope-icon"></i>
            <h1 class="intro-title">당신을 위한<br>특별한 메시지가 도착했습니다</h1>
            <p class="intro-desc">볼륨을 키우고 재생 버튼을 눌러주세요</p>
            <button id="open-btn" class="primary-btn">
                <i class="fa-solid fa-play"></i> 메시지 열기
            </button>
        </div>
    </div>

    <!-- 오디오 플레이어 뷰 -->
    <div id="player-view" class="view-container">
        <!-- 감성적인 배경 (그라데이션 및 파티클 효과) -->
        <div class="bg-gradient"></div>
        <div class="bg-blobs">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
        </div>

        <div class="content-wrapper">
            <div class="header">
                <span class="tag">생일 축하</span>
            </div>

            <div class="message-card">
                <div class="message-text">
                    <p class="fade-in-text">사랑하는 어머니,</p>
                    <p class="fade-in-text delay-1">생신 진심으로 축하드려요.</p>
                    <p class="fade-in-text delay-2">항상 묵묵히 챙겨주시고<br>따뜻하게 안아주셔서 감사합니다.</p>
                    <p class="fade-in-text delay-3">앞으로는 제가 더 잘할게요.<br>오래오래 제 곁에 있어주세요.</p>
                    <p class="fade-in-text delay-4">사랑합니다.</p>
                </div>
            </div>

            <!-- 플레이어 컨트롤 및 웨이브폼 -->
            <div class="player-controls">
                <div class="waveform-container" id="waveform">
                    <!-- 웨이브폼 바가 JS로 생성됩니다 -->
                </div>
                <div class="time-display">
                    <span id="current-time">0:00</span>
                    <span id="total-time">0:45</span>
                </div>
                <div class="control-buttons">
                    <button class="icon-btn"><i class="fa-solid fa-backward-10"></i></button>
                    <button id="play-pause-btn" class="play-btn"><i class="fa-solid fa-pause"></i></button>
                    <button class="icon-btn"><i class="fa-solid fa-forward-10"></i></button>
                </div>
            </div>
            
            <div class="footer-brand">
                Powered by HeartWave
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
